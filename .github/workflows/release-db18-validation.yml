name: Release DB18 transport and cache Linux proof
on:
  push:
    branches: [codex/release-db18-validation]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read exact public source without stored credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/AhmadTellawy/SocialInsight.git
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare pinned Node and disposable TLS PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:24.20.0-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e
          bash ops/release18-transport/linux-test-setup.sh start
      - name: Run selected transport, cache and interruption checks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            -v "$RELEASE18_TEST_FIXTURE/tls:/tls:ro" \
            -e RELEASE18_TEST_CLI=/work/server/scripts/release-db-18/node_modules/prisma/build/index.js \
            -e RELEASE18_TEST_PACKAGE_ROOT=/work/server/scripts/release-db-18 \
            -e RELEASE18_TEST_ARTIFACT_ROOT=/work/transport-test-artifacts \
            node:24.20.0-bookworm-slim@sha256:ba849c60be29959425b8734d57b8b4b7d56f98edd9504c9af091d5281095a71e \
            sh -c 'set -eu; apt-get update -qq; apt-get install -y --no-install-recommends openssl ca-certificates git; cd /work/server/scripts/release-db-18; npm ci --no-audit --no-fund; cd /work; node --test --test-concurrency=1 ops/release18-transport/*.test.mjs'
      - name: Remove only the owned synthetic fixture
        if: always()
        shell: bash
        run: bash ops/release18-transport/linux-test-setup.sh stop
