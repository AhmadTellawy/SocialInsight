name: HEIF confined worker prototype
on:
  push:
    branches: [codex/heif-linux-validation]
permissions:
  contents: read
jobs:
  confinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read exact public source without stored credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin https://github.com/AhmadTellawy/SocialInsight.git
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build pinned runtime with unprivileged confinement launcher
        run: docker build --progress=plain -t si-heif-confined heif-converter
      - name: Run complete converter guard suite
        run: docker run --rm --network none --entrypoint npm -v "$PWD/heif-converter/test:/app/test:ro" si-heif-confined test
      - name: Prove fresh worker and complete native Sharp confinement
        shell: bash
        run: |
          set -euo pipefail
          docker run --name si-heif-prototype --cap-drop ALL --security-opt no-new-privileges --memory 512m --memory-swap 512m --cpus 0.1 --pids-limit 128 --network none --tmpfs /tmp/heif-converter:rw,noexec,nosuid,size=192m,uid=10001,gid=10001,mode=0700 --entrypoint /usr/local/bin/si-heif-confine -v "$PWD/tests/media-native:/fixtures:ro" si-heif-confined --supervise-probe
      - name: Record exact image and exit evidence
        if: always()
        shell: bash
        run: |
          docker image inspect --format '{{.Id}}' si-heif-confined || true
          docker inspect --format '{{json .State}} {{json .HostConfig.Memory}} {{json .HostConfig.NanoCpus}}' si-heif-prototype || true
          docker logs --tail 50 si-heif-prototype || true
          docker rm -f si-heif-prototype || true
