# Isolated synthetic Pages staging. Select this path explicitly when creating
# a Render Blueprint; do not sync it with the existing Production service.
previews:
  generation: off

databases:
  - name: si-pages-qa-db-20260926
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: si_pages_qa
    user: si_pages_qa
    ipAllowList: []

services:
  - type: web
    name: si-pages-qa-media-20260926
    runtime: node
    plan: free
    region: singapore
    buildCommand: node --check stage-hosted/media-service.cjs
    startCommand: node stage-hosted/media-service.cjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: STAGE_ONLY
        value: 'true'
      - key: STAGE_WEB_ORIGIN
        value: https://si-pages-qa-web-20260926.onrender.com
      - key: STAGE_MEDIA_ADMIN_KEY
        generateValue: true

  - type: web
    name: si-pages-qa-api-20260926
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd server && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node stage-hosted/start-api.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: PAGES_ENABLED
        value: 'true'
      - key: STAGE_ONLY
        value: 'true'
      - key: CLIENT_URL
        value: https://si-pages-qa-web-20260926.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: si-pages-qa-db-20260926
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: si-pages-qa-db-20260926
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STAGE_MEDIA_ADMIN_KEY
        fromService:
          type: web
          name: si-pages-qa-media-20260926
          envVarKey: STAGE_MEDIA_ADMIN_KEY
  - type: web
    name: si-pages-qa-web-20260926
    runtime: static
    buildCommand: npm ci && npm run build && node stage-hosted/finish-web-build.cjs
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: VITE_API_URL
        value: https://si-pages-qa-api-20260926.onrender.com/api
      - key: STAGE_ONLY
        value: 'true'
